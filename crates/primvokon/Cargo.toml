[package]
name = "primvokon"
description = "Agentic remote for PiKVM (GTK4 + libadwaita)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pikvm = { path = "../pikvm" }
primvokon-core = { path = "../primvokon-core" }
gtk = { package = "gtk4", version = "0.11", features = ["gnome_46"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
glib = "0.22"
gio = "0.22"
gdk = { package = "gdk4", version = "0.11" }
gdk-pixbuf = "0.22"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
async-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
image.workspace = true
bytes.workspace = true
url.workspace = true

[build-dependencies]
glib-build-tools = "0.22"
